<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101211"><title>下载 Groove Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101211;color:#f0f3ed}*{box-sizing:border-box}body{margin:0;padding:32px 20px;line-height:1.7}main{max-width:560px;margin:8vh auto}small{color:#a6b49d;letter-spacing:.12em}h1{font-size:32px;margin:8px 0 20px}p{color:#a9b4a7}button,.save{display:inline-block;min-height:48px;border:0;border-radius:12px;padding:12px 20px;background:#c8f45a;color:#18200c;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.save[hidden]{display:none}a{color:#c8f45a}#status{min-height:28px;overflow-wrap:anywhere}footer{border-top:1px solid #30372e;margin-top:32px;padding-top:20px;font-size:14px}
</style>
</head>
<body><main>
<small>GROOVE LAB</small><h1>随时打开，开始练习。</h1>
<p>手机或电脑直接<a href="./">打开网页版</a>。iPhone 可在 Safari 的分享菜单中选择“添加到主屏幕”；Android 可用浏览器菜单安装。</p>
<p>电脑离线包约 5.4 MB，包含完整页面、24 个鼓采样和源码。解压后双击 Start-Groove-Lab.cmd，或用 Chrome、Edge、Safari 打开 index.html。</p>
<button id="download">下载电脑离线包</button> <a id="save" class="save" hidden>保存 ZIP</a>
<p id="status" role="status" aria-live="polite"></p>
<footer>网页版首次完整播放后会缓存鼓音色，可再次离线打开。系统清理缓存后需要重新联网。</footer>
</main><script>
const button=document.getElementById('download'),save=document.getElementById('save'),status=document.getElementById('status');let blobUrl;
button.onclick=async()=>{
  button.disabled=true;save.hidden=true;status.textContent='正在准备离线包…';
  try{
    const response=await fetch('./downloads/manifest.json',{cache:'no-cache'});if(!response.ok)throw new Error('下载信息暂不可用');const info=await response.json();
    const chunks=new Array(info.parts.length);let next=0,done=0;
    async function worker(){while(next<info.parts.length){const i=next++,r=await fetch(info.parts[i]);if(!r.ok)throw new Error('下载中断，请重试');chunks[i]=new Uint8Array(await r.arrayBuffer());done++;status.textContent=`正在下载 ${Math.round(done/info.parts.length*100)}%`}}
    await Promise.all(Array.from({length:4},worker));
    const bytes=new Uint8Array(chunks.reduce((n,b)=>n+b.length,0));let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length}
    if(bytes.length!==info.bytes)throw new Error('文件不完整，请重试');
    if(!globalThis.crypto?.subtle)throw new Error('请用 HTTPS 地址或现代浏览器下载');
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');if(digest!==info.sha256)throw new Error('文件校验失败，请重试');
    if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([bytes],{type:'application/zip'}));save.href=blobUrl;save.download=info.name;save.hidden=false;save.click();
    status.textContent='离线包已准备好。若没有开始下载，点击“保存 ZIP”。';button.textContent='重新下载';
  }catch(error){status.textContent=error.message||'下载失败，请重试'}finally{button.disabled=false}
};
</script></body></html>
