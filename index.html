<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101211" />
  <meta name="description" content="轻量、离线可用的鼓循环创作器，支持五种鼓件、三档力度、三连音与 Double 双击。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Groove Lab — 鼓循环创作器</title>
  <style>
    :root{--bg:#101211;--panel:#171a18;--panel2:#1d211e;--line:#303730;--muted:#89928a;--text:#f0f3ed;--lime:#c8f45a;--orange:#ff8a5c;--ghost:#687168;--shadow:0 24px 80px #0008}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Inter,"SF Pro Display","PingFang SC",system-ui,sans-serif}
    body{background:radial-gradient(circle at 75% 0%,#273023 0,transparent 32rem),var(--bg);padding:24px}
    button,input,select{font:inherit}button{color:inherit}
    .app{max-width:1180px;margin:auto;border:1px solid #293029;background:#141715dd;border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--lime);color:#101510;font-weight:900;letter-spacing:-2px}.brand h1{font-size:18px;margin:0;letter-spacing:.03em}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .top-actions{display:flex;gap:8px}.icon-btn,.soft-btn{border:1px solid var(--line);background:#202520;border-radius:12px;padding:10px 14px;cursor:pointer}.icon-btn:hover,.soft-btn:hover{border-color:#4b584c}.icon-btn:active,.soft-btn:active{transform:translateY(1px)}
    main{padding:28px}.transport{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:22px;align-items:center;margin-bottom:28px}
    .play{width:74px;height:74px;border:0;border-radius:50%;background:var(--lime);color:#101510;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 8px #c8f45a10}.play svg{width:25px;fill:currentColor;margin-left:3px}.play.playing svg{margin:0}.play:hover{filter:brightness(1.05)}
    .tempo{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 18px}.tempo-top{display:flex;justify-content:space-between;align-items:baseline}.tempo label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}.bpm{font-size:26px;font-weight:700}.tempo input{width:100%;accent-color:var(--lime);margin-top:11px}
    .switches{display:flex;gap:10px}.toggle{border:1px solid var(--line);background:var(--panel);padding:13px 15px;border-radius:14px;cursor:pointer;color:var(--muted);white-space:nowrap}.toggle.active{color:#101510;background:var(--lime);border-color:var(--lime);font-weight:700}.toggle.practice-active{color:#17100d;background:var(--orange);border-color:var(--orange);font-weight:750}
    .editor{border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:22px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-color:#4d584e transparent;overscroll-behavior-x:contain}
    .editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;min-width:780px;gap:16px}.editor-tools{display:flex;align-items:center;gap:8px}.editor-tools select{padding:8px 30px 8px 10px}.roll-btn{border:1px solid var(--line);background:#202520;border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--muted)}.roll-btn.active{background:var(--orange);border-color:var(--orange);color:#17100d;font-weight:750}.roll-btn:disabled{opacity:.35;cursor:not-allowed}.phase-badge{padding:7px 11px;border-radius:999px;background:#26331f;color:var(--lime);font-size:12px;font-weight:750;white-space:nowrap}.phase-badge.practice{background:#38251f;color:var(--orange)}.legend{display:flex;gap:15px;color:var(--muted);font-size:12px}.key{display:flex;align-items:center;gap:6px}.dot{display:inline-block;border-radius:50%}.dot.accent{width:12px;height:12px;background:var(--orange)}.dot.normal{width:10px;height:10px;background:var(--lime)}.dot.ghost{width:8px;height:8px;background:var(--ghost);border:1px solid #95a096}.roll-mark{font-weight:900;color:var(--orange);letter-spacing:-2px}
    .grid{min-width:780px;display:grid;gap:7px;align-items:center}.count{height:24px;text-align:center;color:#697269;font-size:10px}.count.beat{color:#c8cec7;font-weight:700}.lane-label{height:48px;display:flex;align-items:center;gap:10px;font-weight:650;font-size:13px;position:sticky;left:-1px;z-index:4;background:linear-gradient(90deg,var(--panel) 85%,transparent);border-radius:8px}.lane-label span:first-child{width:28px;color:var(--lime);font-size:17px}.cell{height:48px;border-radius:10px;border:1px solid #333a34;background:#202421;cursor:pointer;position:relative;transition:.12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}.cell.beat-start{margin-left:4px}.cell:hover{border-color:#667166;background:#272d28}.cell::after{content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;border-radius:50%;transition:.12s}.cell[data-v="1"]::after{width:9px;height:9px;background:var(--ghost);border:1px solid #9ca49d}.cell[data-v="2"]{background:#27301f;border-color:#4b6131}.cell[data-v="2"]::after{width:14px;height:14px;background:var(--lime);box-shadow:0 0 14px #c8f45a55}.cell[data-v="3"]{background:#38251f;border-color:#704330}.cell[data-v="3"]::after{width:20px;height:20px;background:var(--orange);box-shadow:0 0 17px #ff8a5c55}.cell.roll::before{content:"••";position:absolute;top:2px;left:50%;translate:-50% 0;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:-1px;z-index:2}.cell.current{outline:2px solid #f4f7ef;outline-offset:2px}.mobile-tip{display:none}
    .bottom{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:18px}.hint{font-size:12px;color:var(--muted)}.patterns{display:flex;gap:8px;align-items:center}.patterns label{font-size:12px;color:var(--muted)}select{background:#202520;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 30px 9px 11px}
    footer{padding:16px 28px 22px;color:#667067;font-size:11px;text-align:center}
    @media(max-width:760px){body{padding:0;padding-bottom:env(safe-area-inset-bottom)}.app{border:0;border-radius:0;min-height:100svh}header{padding:14px 16px;gap:10px}.logo{width:38px;height:38px}.brand h1{font-size:16px}.brand p{display:none}.top-actions .soft-btn:first-child{display:none}.soft-btn{padding:9px 12px}main{padding:16px}.transport{grid-template-columns:64px minmax(0,1fr);gap:12px;margin-bottom:18px}.play{width:60px;height:60px}.tempo{padding:11px 14px;border-radius:15px}.bpm{font-size:22px}.switches{grid-column:1/-1;gap:8px}.toggle{flex:1;min-height:46px;padding:11px}.editor{padding:13px 0 13px 0;border-radius:18px}.editor-head{min-width:0;position:sticky;left:0;width:calc(100vw - 34px);padding:0 13px;flex-direction:column;align-items:stretch;gap:11px;margin-bottom:8px}.editor-tools{width:100%}.editor-tools select,.roll-btn{flex:1;min-height:44px}.legend{gap:10px;flex-wrap:wrap;padding:0 2px}.mobile-tip{display:block;position:sticky;left:0;width:calc(100vw - 34px);padding:4px 13px 11px;color:var(--muted);font-size:11px}.grid{padding:0 12px 4px}.lane-label{height:52px;font-size:11px;gap:4px;background:linear-gradient(90deg,var(--panel) 88%,transparent)}.lane-label span:first-child{width:22px;font-size:15px}.cell{height:52px;border-radius:11px}.bottom{align-items:stretch;flex-direction:column;margin-top:14px}.hint{line-height:1.65}.patterns{justify-content:space-between}.patterns select{flex:1}footer{padding:12px 18px 20px}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand"><div class="logo">GL</div><div><h1>GROOVE LAB</h1><p>把脑海里的律动，变成可以听见的循环</p></div></div><div class="top-actions"><button class="soft-btn" id="copy">复制链接</button><button class="soft-btn" id="clear">清空</button></div></header>
  <main>
    <section class="transport">
      <button class="play" id="play" aria-label="播放"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="tempo"><div class="tempo-top"><label for="tempo">速度</label><div><span class="bpm" id="bpmText">90</span> <small>BPM</small></div></div><input id="tempo" type="range" min="40" max="220" step="5" value="90" /></div>
      <div class="switches"><button class="toggle active" id="loop">循环</button><button class="toggle" id="metro">节拍器</button><button class="toggle" id="listenPractice">听练交替</button></div>
    </section>
    <section class="editor">
      <div class="editor-head"><div class="editor-tools"><select id="division" aria-label="音符划分"><option value="8">八分音符</option><option value="12">八分三连音</option><option value="16" selected>十六分音符</option><option value="24">十六分三连音</option></select><button class="roll-btn" id="rollMode" title="开启后，点击任意音符可切换 Single / Double">Double 双击</button></div><div class="phase-badge" id="phaseBadge" hidden>听：节奏</div><div class="legend"><span class="key"><i class="dot accent"></i>重音</span><span class="key"><i class="dot normal"></i>常规</span><span class="key"><i class="dot ghost"></i>鬼音</span><span class="key"><b class="roll-mark">••</b>Double</span></div></div>
      <div class="mobile-tip">音轨名称会固定在左侧，横向滑动查看完整小节 →</div>
      <div class="grid" id="grid"></div>
    </section>
    <div class="bottom"><div class="hint" id="hint">点击切换力度；开启“Double 双击”后，任意划分、任意力度都可双击　·　空格键播放 / 暂停</div><div class="patterns"><label for="preset">快速开始</label><select id="preset"><option value="basic">基础 Rock</option><option value="funk">Funk Pocket</option><option value="halftime">Half-time</option><option value="blank">空白节奏</option></select></div></div>
  </main>
  <footer>Groove Lab · 为编写、讲解与练习鼓节奏而设计</footer>
</div>
<script>
const lanes=[['hat','踩镲','✣'],['rack','高音嗵鼓','◉'],['snare','军鼓','●'],['floor','落地嗵鼓','◎'],['kick','底鼓','◒']];
let steps=16,rollEdit=false;
function blank(n=steps){const d={};lanes.forEach(([id])=>d[id]=Array(n).fill(0));d.rolls={};lanes.forEach(([id])=>d.rolls[id]=Array(n).fill(false));return d}
function makePreset(name,n=steps){const d=blank(n),q=n/4;if(name==='blank')return d;for(let i=0;i<n;i+=name==='funk'?1:(n===8?1:Math.round(q/2)))d.hat[i]=name==='funk'?(i%q===0?3:2):2;const put=(lane,positions,v=2)=>positions.forEach(p=>{const i=Math.round(p*q);if(i<n)d[lane][i]=v});if(name==='basic'){put('snare',[1,3],3);put('kick',[0,2,2.5])}if(name==='funk'){put('snare',[1,3],3);put('snare',[1.75,2.5,3.75],1);put('kick',[0,.75,1.5,2.5])}if(name==='halftime'){put('snare',[2],3);put('snare',[1.5,3.5],1);put('kick',[0,1.25,2.75])}return d}
let data=makePreset('basic'),playing=false,timer=null,current=-1,audio=null,loop=true,metro=false,listenPractice=false,practicePhase=0,countInStep=steps;
const grid=document.querySelector('#grid');
function countLabel(i){const q=steps/4,pos=i%q,beat=Math.floor(i/q)+1;if(steps===8)return pos===0?beat:'&';if(steps===16)return pos===0?beat:['e','&','a'][pos-1];if(steps===12)return pos===0?beat:['tri','plet'][pos-1];return pos===0?beat:['tri','plet','&','tri','plet'][pos-1]}
function render(){const q=steps/4,mobile=matchMedia('(max-width:760px)').matches,labelWidth=mobile?86:112,cellWidth=mobile?42:30;grid.style.gridTemplateColumns=`${labelWidth}px repeat(${steps},minmax(${cellWidth}px,1fr))`;grid.style.minWidth=mobile?`${labelWidth+steps*cellWidth+(steps+1)*7+24}px`:(steps===24?'1080px':'780px');grid.innerHTML='<div></div>'+Array.from({length:steps},(_,i)=>`<div class="count ${i%q===0?'beat':''}">${countLabel(i)}</div>`).join('');lanes.forEach(([id,name,icon])=>{grid.insertAdjacentHTML('beforeend',`<div class="lane-label"><span>${icon}</span>${name}</div>`);data[id].forEach((v,i)=>grid.insertAdjacentHTML('beforeend',`<button class="cell ${i%q===0&&i?'beat-start':''} ${data.rolls[id][i]?'roll':''}" data-lane="${id}" data-step="${i}" data-v="${v}" aria-label="${name} 第 ${i+1} 格${data.rolls[id][i]?'，Double 双击':''}"></button>`))})}
grid.addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c)return;const {lane,step}=c.dataset,i=+step;if(rollEdit){if(!data[lane][i]){data[lane][i]=2;c.dataset.v=2}data.rolls[lane][i]=!data.rolls[lane][i];c.classList.toggle('roll',data.rolls[lane][i])}else{data[lane][i]=({0:2,2:3,3:1,1:0})[data[lane][i]];if(!data[lane][i])data.rolls[lane][i]=false;c.dataset.v=data[lane][i];c.classList.toggle('roll',data.rolls[lane][i])}saveHash()});
function ensureAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)()}
function noiseBuffer(){const b=audio.createBuffer(1,audio.sampleRate*.12,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
function hit(type,v,time){if(!v)return;const gain=[0,.16,.48,.9][v];if(['kick','rack','floor'].includes(type)){const o=audio.createOscillator(),g=audio.createGain(),freq=type==='kick'?[145,45]:type==='rack'?[210,105]:[125,62];o.frequency.setValueAtTime(freq[0],time);o.frequency.exponentialRampToValueAtTime(freq[1],time+(type==='kick'?.12:.18));g.gain.setValueAtTime(gain*(type==='kick'?1:.72),time);g.gain.exponentialRampToValueAtTime(.001,time+(type==='kick'?.2:.3));o.connect(g).connect(audio.destination);o.start(time);o.stop(time+.32)}else{const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=noiseBuffer();f.type=type==='hat'?'highpass':'bandpass';f.frequency.value=type==='hat'?6500:1800;g.gain.setValueAtTime(gain*(type==='hat'?.34:.55),time);g.gain.exponentialRampToValueAtTime(.001,time+(type==='hat'?.045:.13));s.connect(f).connect(g).connect(audio.destination);s.start(time)}}
function stepMs(){return 60000/+document.querySelector('#tempo').value/(steps/4)}
function clickHit(t,accent=false){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=accent?1200:850;g.gain.setValueAtTime(accent?.2:.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.04)}
function updatePracticeUI(){if(playing&&countInStep<steps){phaseBadge.hidden=false;phaseBadge.classList.remove('practice');phaseBadge.textContent=`预备：${Math.floor(countInStep/(steps/4))+1}`;return}phaseBadge.hidden=!listenPractice;phaseBadge.classList.toggle('practice',practicePhase===1);phaseBadge.textContent=practicePhase===0?'听：节奏':'练：节拍器'}
function tick(){if(!playing)return;const t=audio.currentTime+.02,q=steps/4;if(countInStep<steps){document.querySelectorAll('.cell').forEach(c=>c.classList.remove('current'));updatePracticeUI();if(countInStep%q===0)clickHit(t,countInStep===0);countInStep++;return}const wrapped=current===steps-1;current=(current+1)%steps;if(wrapped&&listenPractice){practicePhase=1-practicePhase;updatePracticeUI()}document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('current',+c.dataset.step===current));const grooveOn=!listenPractice||practicePhase===0;lanes.forEach(([id])=>{if(!grooveOn)return;hit(id,data[id][current],t);if(data.rolls[id][current])hit(id,data[id][current],t+stepMs()/2000)});const clickOn=metro||(listenPractice&&practicePhase===1);if(clickOn&&current%q===0)clickHit(t,current===0);if(current===steps-1&&!loop)setTimeout(stop,60)}
function schedule(){clearInterval(timer);timer=setInterval(tick,stepMs())}
function start(){ensureAudio();audio.resume();playing=true;current=-1;practicePhase=0;countInStep=0;updatePracticeUI();play.classList.add('playing');play.innerHTML='<svg viewBox="0 0 24 24"><path d="M7 6h4v12H7zm6 0h4v12h-4z"/></svg>';tick();schedule()}
function stop(){playing=false;clearInterval(timer);practicePhase=0;countInStep=steps;updatePracticeUI();document.querySelectorAll('.cell').forEach(c=>c.classList.remove('current'));play.classList.remove('playing');play.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
const loopBtn=document.querySelector('#loop');play.onclick=()=>playing?stop():start();tempo.oninput=e=>{bpmText.textContent=e.target.value;if(playing)schedule()};loopBtn.onclick=()=>{loop=!loop;loopBtn.classList.toggle('active',loop);if(!loop&&listenPractice){listenPractice=false;practicePhase=0;listenPracticeBtn.classList.remove('practice-active');updatePracticeUI()}};document.querySelector('#metro').onclick=e=>{metro=!metro;e.currentTarget.classList.toggle('active',metro)};const listenPracticeBtn=document.querySelector('#listenPractice');listenPracticeBtn.onclick=()=>{listenPractice=!listenPractice;practicePhase=0;listenPracticeBtn.classList.toggle('practice-active',listenPractice);if(listenPractice&&!loop){loop=true;loopBtn.classList.add('active')}updatePracticeUI()};
document.querySelector('#clear').onclick=()=>{data=blank();render();saveHash()};document.querySelector('#preset').onchange=e=>{data=makePreset(e.target.value);render();saveHash()};
document.querySelector('#division').onchange=e=>{if(playing)stop();steps=+e.target.value;rollEdit=false;rollMode.classList.remove('active');data=makePreset(document.querySelector('#preset').value);hint.textContent='点击格子切换力度；开启“Double 双击”后点击格子切换 Single / Double　·　空格键播放 / 暂停';render();saveHash()};
document.querySelector('#rollMode').onclick=e=>{rollEdit=!rollEdit;e.currentTarget.classList.toggle('active',rollEdit);hint.textContent=rollEdit?'Double 编辑已开启：点击任意格子添加或取消双击，原有力度保持不变':'点击格子切换力度：常规 → 重音 → 鬼音 → 关闭　·　空格键播放 / 暂停'};
document.querySelector('#copy').onclick=async e=>{saveHash();await navigator.clipboard.writeText(location.href);const old=e.target.textContent;e.target.textContent='已复制';setTimeout(()=>e.target.textContent=old,1200)};
function saveHash(){location.hash=btoa(JSON.stringify({steps,data}))}function loadHash(){if(location.hash)try{let saved=JSON.parse(atob(location.hash.slice(1)));if(saved.steps&&saved.data){steps=saved.steps;data=saved.data}else{data=saved;steps=data.hat?.length||16}lanes.forEach(([id])=>{if(!Array.isArray(data[id])||data[id].length!==steps)data[id]=Array(steps).fill(0)});if(!data.rolls)data.rolls={};lanes.forEach(([id])=>{if(!Array.isArray(data.rolls[id])||data.rolls[id].length!==steps)data.rolls[id]=Array(steps).fill(false)});division.value=String(steps)}catch{}}
addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();playing?stop():start()}});let lastMobile=matchMedia('(max-width:760px)').matches;addEventListener('resize',()=>{const now=matchMedia('(max-width:760px)').matches;if(now!==lastMobile){lastMobile=now;render()}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));loadHash();render();
</script>
</body></html>
